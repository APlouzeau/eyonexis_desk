<svg xmlns="http://www.w3.org/2000/svg" viewBox="14.5 9.5 72 82" fill="none">

    <!-- Etoiles externes -->
    <ellipse cx="50" cy="50" rx="35" ry="40" fill="none" stroke="#ff2a5fc0" stroke-width="1" opacity="0.5" stroke-dasharray="0.5 5" />

    <!-- Etoiles internes -->
    <ellipse cx="50" cy="50" rx="25" ry="35" fill="none" stroke="#ff2a5fc0" stroke-width="1" opacity="0.5" stroke-dasharray="1 4" />

    <!-- Oeil -->
    <ellipse cx="50" cy="50" rx="21" ry="25" fill="none" stroke="#ff2a5fc0" stroke-width="3" opacity="0.8" />
    <ellipse cx="50" cy="50" rx="7" ry="10" fill="#ff2a5fc0" />

    <!-- Croix -->
    <polygon points="25,25 75,75 75,25 25,75 25,25" stroke="#ff2a5fc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.2" fill="none" />

</svg>
